[project]
name = "okb-assist"
version = "0.1.0"
description = "论文与专著数据管理系统"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "sqlalchemy>=2.0.35",
    "python-multipart>=0.0.9",
    "httpx>=0.27.2",
    "qdrant-client>=1.12.1",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
    "jinja2>=3.1.4",
    "pydantic-settings>=2.5.2",
    "attrs>=23.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
