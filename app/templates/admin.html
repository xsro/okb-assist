<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - OKB-Assist</title>
    <link rel="stylesheet" href="/assist/static/style.css">
    <style>
        .batch-controls {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .batch-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            padding: 1.25rem 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
        }
        .batch-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .batch-btn .icon {
            font-size: 1.5rem;
        }
        .batch-btn .count {
            font-size: 0.75rem;
            opacity: 0.8;
        }
        .batch-btn-parse { background: #dbeafe; color: #1e40af; border-color: #93c5fd; }
        .batch-btn-parse:hover:not(:disabled) { background: #bfdbfe; }
        .batch-btn-extract { background: #fef3c7; color: #92400e; border-color: #fcd34d; }
        .batch-btn-extract:hover:not(:disabled) { background: #fde68a; }
        .batch-btn-index { background: #ede9fe; color: #5b21b6; border-color: #c4b5fd; }
        .batch-btn-index:hover:not(:disabled) { background: #ddd6fe; }
        .batch-btn-full { background: #d1fae5; color: #065f46; border-color: #6ee7b7; }
        .batch-btn-full:hover:not(:disabled) { background: #a7f3d0; }
        .batch-btn-reset { background: #fee2e2; color: #991b1b; border-color: #fca5a5; }
        .batch-btn-reset:hover:not(:disabled) { background: #fecaca; }
        .batch-btn-active {
            border-width: 3px;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
            animation: btn-pulse 2s infinite;
        }
        @keyframes btn-pulse {
            0%, 100% { box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2); }
            50% { box-shadow: 0 0 0 6px rgba(37, 99, 235, 0.1); }
        }
        .batch-status {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            padding: 1rem;
            background: var(--bg);
            border-radius: 8px;
            margin-bottom: 1rem;
        }
        .batch-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .batch-item .count {
            font-size: 2rem;
            font-weight: 600;
            color: var(--primary);
        }
        .batch-item .label {
            font-size: 0.875rem;
            color: var(--text-muted);
        }
        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
        }
        .status-running { background: #d1fae5; color: #065f46; }
        .status-paused { background: #fef3c7; color: #92400e; }
        .status-idle { background: #e2e8f0; color: #475569; }
        .pulse { animation: pulse 1.5s infinite; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @media (max-width: 768px) {
            .batch-controls {
                grid-template-columns: 1fr;
                gap: 0.75rem;
            }
            .batch-btn {
                padding: 1rem;
            }
            .batch-status {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 0.75rem;
            }
            .batch-item .count {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>📚 OKB-Assist</h1>
            <nav id="nav"></nav>
        </div>
    </header>

    <main class="container">
        <h2 style="margin-bottom:1.5rem">管理后台</h2>

        <!-- Stats -->
        <div class="stats-grid" id="stats-grid">
            <div class="stat-card">
                <h3 id="stat-docs">-</h3>
                <p>文献总数</p>
            </div>
            <div class="stat-card">
                <h3 id="stat-pending">-</h3>
                <p>待处理</p>
            </div>
            <div class="stat-card">
                <h3 id="stat-processing">-</h3>
                <p>处理中</p>
            </div>
            <div class="stat-card">
                <h3 id="stat-indexed">-</h3>
                <p>已索引</p>
            </div>
        </div>

        <!-- Batch Processing -->
        <div class="card" style="margin-bottom:1.5rem">
            <div class="section-header" style="margin-bottom:1rem">
                <h2>批量处理</h2>
                <div class="action-row" style="align-items:center;gap:1rem">
                    <span id="batch-status-indicator" class="status-indicator status-idle">空闲</span>
                    <button class="btn btn-warning btn-sm" id="btn-pause" onclick="pauseBatch()" style="display:none">⏸ 暂停</button>
                </div>
            </div>

            <div class="batch-status">
                <div class="batch-item">
                    <span class="count" id="batch-pending">-</span>
                    <span class="label">待处理</span>
                </div>
                <div class="batch-item">
                    <span class="count" id="batch-processing">-</span>
                    <span class="label">处理中</span>
                </div>
                <div class="batch-item">
                    <span class="count" id="batch-completed">-</span>
                    <span class="label">已完成</span>
                </div>
                <div class="batch-item">
                    <span class="count" id="batch-total">-</span>
                    <span class="label">总计</span>
                </div>
                <div class="batch-item">
                    <span class="count" id="batch-running">-</span>
                    <span class="label">并发任务</span>
                </div>
            </div>

            <div class="batch-controls" id="batch-controls">
                <button class="batch-btn batch-btn-parse" id="btn-parse" onclick="startBatch('parse')">
                    <span class="icon">📄</span>
                    <span>全部上传任务解析 PDF</span>
                    <span class="count" id="count-parse">-</span>
                </button>
                <button class="batch-btn batch-btn-extract" id="btn-extract" onclick="startBatch('extract')">
                    <span class="icon">📋</span>
                    <span>全部已解析任务提取元数据</span>
                    <span class="count" id="count-extract">-</span>
                </button>
                <button class="batch-btn batch-btn-index" id="btn-index" onclick="startBatch('index')">
                    <span class="icon">🔍</span>
                    <span>全部已提取任务进行索引</span>
                    <span class="count" id="count-index">-</span>
                </button>
                <button class="batch-btn batch-btn-full" id="btn-full" onclick="startBatch('full')">
                    <span class="icon">🚀</span>
                    <span>全部上传任务一键处理</span>
                    <span class="count" id="count-full">-</span>
                </button>
                <button class="batch-btn batch-btn-reset" id="btn-reset-errors" onclick="resetAllErrors()">
                    <span class="icon">🔄</span>
                    <span>重置所有失败任务</span>
                    <span class="count" id="count-errors">-</span>
                </button>
            </div>
        </div>

        <!-- Processing Tasks -->
        <div class="card" style="margin-bottom:1.5rem">
            <h2 style="margin-bottom:1rem">处理中的任务</h2>
            <div id="processing-tasks" style="color:var(--text-muted)">加载中...</div>
        </div>

        <!-- Qdrant Collections -->
        <div class="card">
            <h2 style="margin-bottom:1rem">Qdrant 集合</h2>
            <div id="collections-list" style="color:var(--text-muted)">加载中...</div>
        </div>
    </main>

    <script src="/assist/static/app.js"></script>
    <script>
        let batchTimer = null;
        let activeBatch = null; // 'parse' | 'extract' | 'index' | 'full' | null

        async function loadStats() {
            try {
                const [stats, batchStatus] = await Promise.all([
                    api.get('/assist/api/admin/stats'),
                    api.get('/assist/api/pipeline/batch/status'),
                ]);

                document.getElementById('stat-docs').textContent = stats.documents;
                document.getElementById('stat-pending').textContent = (stats.status_counts?.uploaded || 0) + (stats.status_counts?.error || 0);
                document.getElementById('stat-processing').textContent = (stats.status_counts?.parsing || 0) + (stats.status_counts?.extracting || 0) + (stats.status_counts?.indexing || 0);
                document.getElementById('stat-indexed').textContent = stats.status_counts?.indexed || 0;

                // Update per-stage counts from batch status
                const sc = batchStatus.stage_counts || {};
                const parseCount = (sc.uploaded || 0) + (sc.error || 0);
                const extractCount = sc.markdown_done || 0;
                const indexCount = sc.meta_done || 0;

                document.getElementById('count-parse').textContent = `${parseCount} 个待解析`;
                document.getElementById('count-extract').textContent = `${extractCount} 个待提取`;
                document.getElementById('count-index').textContent = `${indexCount} 个待索引`;
                document.getElementById('count-full').textContent = `${parseCount} 个待处理`;

                const errorCount = sc.error || 0;
                document.getElementById('count-errors').textContent = `${errorCount} 个失败`;

                // Disable buttons with 0 count or when batch is active
                document.getElementById('btn-parse').disabled = (parseCount === 0) || activeBatch !== null;
                document.getElementById('btn-extract').disabled = (extractCount === 0) || activeBatch !== null;
                document.getElementById('btn-index').disabled = (indexCount === 0) || activeBatch !== null;
                document.getElementById('btn-full').disabled = (parseCount === 0) || activeBatch !== null;
                document.getElementById('btn-reset-errors').disabled = (errorCount === 0) || activeBatch !== null;

                // Collections
                const collectionsDiv = document.getElementById('collections-list');
                if (stats.qdrant_collections && stats.qdrant_collections.length > 0) {
                    collectionsDiv.innerHTML = stats.qdrant_collections.map(c =>
                        `<span class="badge badge-indexed" style="margin:0.25rem">${c}</span>`
                    ).join('');
                } else {
                    collectionsDiv.textContent = '暂无集合';
                }
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        async function loadBatchStatus() {
            try {
                const status = await api.get('/assist/api/pipeline/batch/status');

                document.getElementById('batch-pending').textContent = status.pending;
                document.getElementById('batch-processing').textContent = status.processing;
                document.getElementById('batch-completed').textContent = status.completed;
                document.getElementById('batch-total').textContent = status.total;
                document.getElementById('batch-running').textContent = `${status.running_tasks}/${status.max_concurrent}`;

                const indicator = document.getElementById('batch-status-indicator');
                const btnPause = document.getElementById('btn-pause');

                if (status.paused) {
                    indicator.className = 'status-indicator status-paused';
                    indicator.textContent = '已暂停';
                    btnPause.style.display = 'none';
                    activeBatch = null;
                } else if (status.processing > 0 || status.running_tasks > 0) {
                    indicator.className = 'status-indicator status-running pulse';
                    indicator.textContent = '运行中';
                    btnPause.style.display = 'inline-flex';
                } else {
                    indicator.className = 'status-indicator status-idle';
                    indicator.textContent = '空闲';
                    btnPause.style.display = 'none';
                    activeBatch = null;
                }

                // Update button active states
                updateButtonStates();

            } catch (err) {
                console.error('Batch status error:', err);
            }
        }

        function updateButtonStates() {
            const btns = ['btn-parse', 'btn-extract', 'btn-index', 'btn-full', 'btn-reset-errors'];
            btns.forEach(id => {
                const el = document.getElementById(id);
                if (activeBatch !== null) {
                    el.disabled = true;
                    if (id === `btn-${activeBatch}`) {
                        el.classList.add('batch-btn-active');
                    } else {
                        el.classList.remove('batch-btn-active');
                    }
                } else {
                    el.classList.remove('batch-btn-active');
                }
            });
        }

        async function startBatch(type) {
            const endpoints = {
                'parse': '/assist/api/pipeline/batch/start-parse',
                'extract': '/assist/api/pipeline/batch/start-extract',
                'index': '/assist/api/pipeline/batch/start-index',
                'full': '/assist/api/pipeline/batch/start-full',
            };

            const labels = {
                'parse': '批量解析',
                'extract': '批量提取',
                'index': '批量索引',
                'full': '全流程处理',
            };

            try {
                const result = await api.post(endpoints[type]);
                if (result.pending === 0) {
                    showToast(result.detail, 'info');
                    return;
                }
                activeBatch = type;
                showToast(result.detail, 'success');
                updateButtonStates();
                startBatchPolling();
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        async function pauseBatch() {
            try {
                const result = await api.post('/assist/api/pipeline/batch/pause');
                showToast(result.detail, 'info');
                activeBatch = null;
                loadBatchStatus();
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        async function resetAllErrors() {
            const errorCount = parseInt(document.getElementById('count-errors').textContent) || 0;
            if (errorCount === 0) {
                showToast('没有失败的任务需要重置', 'info');
                return;
            }

            if (!confirm(`确定要重置所有 ${errorCount} 个失败任务的状态吗？\n\n重置后：\n- 有 Markdown 文件的任务将重置为"已解析"状态\n- 没有 Markdown 文件的任务将重置为"已上传"状态`)) {
                return;
            }

            try {
                const result = await api.post('/assist/api/pipeline/batch/reset-errors');
                showToast(result.detail, 'success');
                await loadStats();
                await loadBatchStatus();
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        function startBatchPolling() {
            if (batchTimer) clearInterval(batchTimer);
            batchTimer = setInterval(async () => {
                await loadBatchStatus();
                await loadStats();
                await loadProcessingTasks();

                // Stop polling if idle
                try {
                    const status = await api.get('/assist/api/pipeline/batch/status');
                    if (status.processing === 0 && status.running_tasks === 0 && !status.paused) {
                        clearInterval(batchTimer);
                        batchTimer = null;
                        activeBatch = null;
                        updateButtonStates();
                    }
                } catch (err) {}
            }, 3000);
        }

        async function loadProcessingTasks() {
            try {
                const data = await api.get('/assist/api/documents/?status_filter=parsing,extracting,indexing&page_size=100');
                const container = document.getElementById('processing-tasks');

                const processingStatuses = ['parsing', 'extracting', 'indexing'];
                const processingDocs = (data.items || []).filter(d => processingStatuses.includes(d.status));

                if (processingDocs.length === 0) {
                    container.innerHTML = '<p style="text-align:center;padding:1rem;color:var(--text-muted)">暂无处理中的任务</p>';
                    return;
                }

                const statusLabels = {
                    'parsing': '解析中',
                    'extracting': '提取中',
                    'indexing': '索引中',
                };

                container.innerHTML = processingDocs.map(doc => `
                    <div class="task-item">
                        <div class="task-info">
                            <a href="/assist/detail/${doc.id}" style="font-weight:500">${doc.title || doc.filename || '未命名'}</a>
                            <p style="font-size:0.75rem;color:var(--text-muted);margin:0.25rem 0 0 0">ID: ${doc.id}</p>
                        </div>
                        <span class="badge badge-${doc.status}">${statusLabels[doc.status] || doc.status}</span>
                    </div>
                `).join('');
            } catch (err) {
                console.error('Processing tasks error:', err);
            }
        }

        // Initial load
        loadStats();
        loadBatchStatus();
        loadProcessingTasks();
    </script>
</body>
</html>
