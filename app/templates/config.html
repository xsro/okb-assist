<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统配置 - OKB-Assist</title>
    <link rel="stylesheet" href="/assist/static/style.css">
    <style>
        .config-section {
            margin-bottom: 1.5rem;
        }
        .config-section h3 {
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1rem;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }
        .form-group label {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
        }
        .form-group input, .form-group select {
            padding: 0.5rem 0.75rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.9rem;
            background: var(--bg);
            color: var(--text);
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
        }
        .form-row {
            display: flex;
            align-items: flex-end;
            gap: 0.75rem;
        }
        .form-row .form-group {
            flex: 1;
        }
        .test-result {
            margin-top: 0.5rem;
            padding: 0.5rem 0.75rem;
            border-radius: 6px;
            font-size: 0.8rem;
            display: none;
        }
        .test-result.show { display: block; }
        .test-result.success { background: #d1fae5; color: #065f46; }
        .test-result.error { background: #fee2e2; color: #991b1b; }
        .test-result.info { background: #dbeafe; color: #1e40af; }

        /* 向量数据库卡片 */
        .vectordb-card {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
            background: var(--bg);
            position: relative;
        }
        .vectordb-card .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }
        .vectordb-card .card-header h4 {
            margin: 0;
            font-size: 0.95rem;
        }
        .vectordb-card .remove-btn {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 1.2rem;
            padding: 0.25rem;
            border-radius: 4px;
        }
        .vectordb-card .remove-btn:hover {
            background: #fee2e2;
        }
        .vectordb-list {
            display: flex;
            flex-direction: column;
            gap: 0;
        }
        .add-vectordb-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.75rem;
            border: 2px dashed var(--border);
            border-radius: 8px;
            background: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .add-vectordb-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }
        .toggle-switch {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            user-select: none;
        }
        .toggle-switch input[type="checkbox"] {
            width: 36px;
            height: 20px;
            appearance: none;
            background: #cbd5e1;
            border-radius: 10px;
            position: relative;
            cursor: pointer;
            transition: background 0.2s;
        }
        .toggle-switch input[type="checkbox"]::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: white;
            top: 2px;
            left: 2px;
            transition: transform 0.2s;
        }
        .toggle-switch input[type="checkbox"]:checked {
            background: var(--primary);
        }
        .toggle-switch input[type="checkbox"]:checked::after {
            transform: translateX(16px);
        }
        .action-bar {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
            margin-top: 1.5rem;
        }
        .db-type-specific {
            margin-top: 0.75rem;
        }
        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .action-bar {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>📚 OKB-Assist</h1>
            <nav id="nav"></nav>
        </div>
    </header>

    <main class="container">
        <h2 style="margin-bottom:1.5rem">⚙️ 系统配置</h2>

        <!-- MinerU 配置 -->
        <div class="card config-section">
            <h3>📄 MinerU (PDF 解析)</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label>服务地址</label>
                    <input type="text" id="mineru-url" placeholder="http://127.0.0.1:8002">
                </div>
                <div class="form-group">
                    <label>API Key</label>
                    <input type="password" id="mineru-key" placeholder="Bearer Token">
                </div>
                <div class="form-group">
                    <label>最大并发任务</label>
                    <input type="number" id="mineru-max-tasks" min="1" max="20" value="3">
                </div>
            </div>
            <div style="margin-top:0.75rem">
                <button class="btn btn-secondary btn-sm" onclick="testService('mineru')">🔗 测试连接</button>
                <div class="test-result" id="test-mineru"></div>
            </div>
        </div>

        <!-- Ollama 配置 -->
        <div class="card config-section">
            <h3>🤖 Ollama (LLM / Embedding)</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label>服务地址</label>
                    <input type="text" id="ollama-url" placeholder="http://127.0.0.1:11434">
                </div>
                <div class="form-group">
                    <label>API Key（可选）</label>
                    <input type="password" id="ollama-key" placeholder="留空则无需认证">
                </div>
                <div class="form-group">
                    <label>LLM 模型（元数据提取）</label>
                    <input type="text" id="ollama-model" placeholder="qwen3.5:9b">
                </div>
                <div class="form-group">
                    <label>Embedding 模型（向量化）</label>
                    <input type="text" id="ollama-embed-model" placeholder="nomic-embed-text">
                </div>
            </div>
            <div style="margin-top:0.75rem">
                <button class="btn btn-secondary btn-sm" onclick="testService('ollama')">🔗 测试连接</button>
                <div class="test-result" id="test-ollama"></div>
            </div>
        </div>

        <!-- 向量数据库配置 -->
        <div class="card config-section">
            <h3>🗄️ 向量数据库</h3>
            <div class="vectordb-list" id="vectordb-list">
                <!-- 动态渲染 -->
            </div>
            <button class="add-vectordb-btn" onclick="addVectorDB()">
                ＋ 添加向量数据库
            </button>
        </div>

        <!-- 系统配置 -->
        <div class="card config-section">
            <h3>🔧 系统设置</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label>访问 Token</label>
                    <input type="password" id="upload-token" placeholder="系统访问密钥">
                </div>
                <div class="form-group">
                    <label>最大并发处理数</label>
                    <input type="number" id="max-concurrent" min="1" max="20" value="3">
                </div>
                <div class="form-group">
                    <label>数据库 URL</label>
                    <input type="text" id="database-url" placeholder="sqlite:///./okb_assist.db">
                </div>
                <div class="form-group">
                    <label>上传文件目录</label>
                    <input type="text" id="uploads-folder" placeholder="uploads">
                </div>
            </div>
        </div>

        <!-- 操作栏 -->
        <div class="action-bar">
            <button class="btn btn-secondary" onclick="reloadConfig()">🔄 重新加载</button>
            <button class="btn btn-primary" id="btn-save" onclick="saveAllConfig()">💾 保存配置</button>
        </div>
    </main>

    <script src="/assist/static/app.js"></script>
    <script>
        let currentConfig = null;
        let vectordbCounter = 0;

        // ── 向量数据库类型配置模板 ──
        const DB_TYPE_FIELDS = {
            qdrant: {
                fields: [
                    { key: 'url', label: '服务地址', placeholder: 'http://127.0.0.1:6333', type: 'text' },
                    { key: 'collection', label: '集合名称', placeholder: 'documents', type: 'text' },
                ]
            },
            milvus: {
                fields: [
                    { key: 'url', label: '服务地址', placeholder: 'http://127.0.0.1:19530', type: 'text' },
                    { key: 'collection', label: '集合名称', placeholder: 'documents', type: 'text' },
                    { key: 'api_key', label: 'API Key', placeholder: '可选', type: 'password' },
                ]
            },
            chroma: {
                fields: [
                    { key: 'url', label: '服务地址', placeholder: 'http://127.0.0.1:8000', type: 'text' },
                    { key: 'collection', label: '集合名称', placeholder: 'documents', type: 'text' },
                ]
            }
        };

        const DB_TYPE_LABELS = { qdrant: 'Qdrant', milvus: 'Milvus', chroma: 'ChromaDB' };

        // ── 初始化 ──
        async function init() {
            try {
                currentConfig = await api.get('/assist/api/config');
                fillForm(currentConfig);
            } catch (err) {
                showToast('加载配置失败: ' + err.message, 'error');
            }
        }

        function fillForm(cfg) {
            // MinerU
            document.getElementById('mineru-url').value = cfg.mineru?.url || '';
            document.getElementById('mineru-key').value = cfg.mineru?.key || '';
            document.getElementById('mineru-max-tasks').value = cfg.mineru?.max_tasks ?? 3;

            // Ollama
            document.getElementById('ollama-url').value = cfg.ollama?.url || '';
            document.getElementById('ollama-key').value = cfg.ollama?.key || '';
            document.getElementById('ollama-model').value = cfg.ollama?.model || '';
            document.getElementById('ollama-embed-model').value = cfg.ollama?.embed_model || '';

            // Vector DBs
            const list = document.getElementById('vectordb-list');
            list.innerHTML = '';
            vectordbCounter = 0;
            (cfg.vector_dbs || []).forEach(db => {
                addVectorDB(db);
            });

            // System
            document.getElementById('upload-token').value = cfg.upload_token || '';
            document.getElementById('max-concurrent').value = cfg.max_concurrent_tasks ?? 3;
            document.getElementById('database-url').value = cfg.database_url || '';
            document.getElementById('uploads-folder').value = cfg.uploads_folder || '';
        }

        // ── 向量数据库卡片管理 ──
        function addVectorDB(data = null) {
            vectordbCounter++;
            const id = vectordbCounter;
            const list = document.getElementById('vectordb-list');

            const card = document.createElement('div');
            card.className = 'vectordb-card';
            card.id = `vdb-${id}`;
            card.innerHTML = `
                <div class="card-header">
                    <h4>
                        <select onchange="onTypeChange(${id})" id="vdb-type-${id}" style="font-weight:600;padding:0.25rem 0.5rem;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--text)">
                            ${Object.entries(DB_TYPE_LABELS).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}
                        </select>
                    </h4>
                    <div style="display:flex;align-items:center;gap:0.75rem">
                        <label class="toggle-switch">
                            <input type="checkbox" id="vdb-enabled-${id}" checked>
                            <span style="font-size:0.8rem;color:var(--text-muted)">启用</span>
                        </label>
                        <button class="remove-btn" onclick="removeVectorDB(${id})" title="删除">✕</button>
                    </div>
                </div>
                <div class="form-grid">
                    <div class="form-group">
                        <label>ID（唯一标识）</label>
                        <input type="text" id="vdb-id-${id}" placeholder="如: default, production" value="${data?.id || ''}">
                    </div>
                    <div class="form-group">
                        <label>名称</label>
                        <input type="text" id="vdb-name-${id}" placeholder="显示名称" value="${data?.name || ''}">
                    </div>
                </div>
                <div class="db-type-specific" id="vdb-fields-${id}"></div>
                <div style="margin-top:0.5rem">
                    <button class="btn btn-secondary btn-sm" onclick="testVectorDB(${id})">🔗 测试连接</button>
                    <div class="test-result" id="test-vdb-${id}"></div>
                </div>
            `;

            list.appendChild(card);

            // 设置类型并渲染类型特定字段
            if (data?.type) {
                document.getElementById(`vdb-type-${id}`).value = data.type;
            }
            renderTypeFields(id, data);

            // 设置 enabled 状态
            if (data && data.enabled === false) {
                document.getElementById(`vdb-enabled-${id}`).checked = false;
            }
        }

        function onTypeChange(id) {
            renderTypeFields(id);
        }

        function renderTypeFields(id, data = null) {
            const type = document.getElementById(`vdb-type-${id}`).value;
            const container = document.getElementById(`vdb-fields-${id}`);
            const config = DB_TYPE_FIELDS[type];

            container.innerHTML = `
                <div class="form-grid">
                    ${config.fields.map(f => `
                        <div class="form-group">
                            <label>${f.label}</label>
                            <input type="${f.type}" id="vdb-${f.key}-${id}"
                                   placeholder="${f.placeholder}"
                                   value="${data?.[f.key] || ''}">
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function removeVectorDB(id) {
            const card = document.getElementById(`vdb-${id}`);
            if (card) card.remove();
        }

        function collectVectorDBs() {
            const cards = document.querySelectorAll('.vectordb-card');
            const dbs = [];
            cards.forEach(card => {
                const id = card.id.replace('vdb-', '');
                const type = document.getElementById(`vdb-type-${id}`).value;
                const config = DB_TYPE_FIELDS[type];

                const db = {
                    id: document.getElementById(`vdb-id-${id}`).value.trim(),
                    name: document.getElementById(`vdb-name-${id}`).value.trim(),
                    type: type,
                    enabled: document.getElementById(`vdb-enabled-${id}`).checked,
                };

                config.fields.forEach(f => {
                    const el = document.getElementById(`vdb-${f.key}-${id}`);
                    if (el) db[f.key] = el.value.trim();
                });

                dbs.push(db);
            });
            return dbs;
        }

        // ── 测试连接 ──
        async function testService(type) {
            const resultEl = document.getElementById(`test-${type}`);
            resultEl.className = 'test-result show info';
            resultEl.textContent = '测试中...';

            let params = { type };
            if (type === 'mineru') {
                params.url = document.getElementById('mineru-url').value.trim();
                params.key = document.getElementById('mineru-key').value.trim();
            } else if (type === 'ollama') {
                params.url = document.getElementById('ollama-url').value.trim();
                params.model = document.getElementById('ollama-model').value.trim();
            }

            try {
                const result = await api.post('/assist/api/config/test', params);
                resultEl.className = `test-result show ${result.status === 'connected' ? 'success' : 'error'}`;
                let text = result.detail || '';
                if (result.models) text += `\n可用模型: ${result.models.join(', ')}`;
                if (result.version) text += `\n版本: ${result.version}`;
                resultEl.textContent = text;
            } catch (err) {
                resultEl.className = 'test-result show error';
                resultEl.textContent = err.message;
            }
        }

        async function testVectorDB(id) {
            const resultEl = document.getElementById(`test-vdb-${id}`);
            resultEl.className = 'test-result show info';
            resultEl.textContent = '测试中...';

            const type = document.getElementById(`vdb-type-${id}`).value;
            const urlEl = document.getElementById(`vdb-url-${id}`);
            const params = {
                type,
                url: urlEl ? urlEl.value.trim() : '',
            };

            try {
                const result = await api.post('/assist/api/config/test', params);
                resultEl.className = `test-result show ${result.status === 'connected' ? 'success' : 'error'}`;
                let text = result.detail || '';
                if (result.collections) text += `\n集合: ${result.collections.join(', ')}`;
                resultEl.textContent = text;
            } catch (err) {
                resultEl.className = 'test-result show error';
                resultEl.textContent = err.message;
            }
        }

        // ── 保存配置 ──
        async function saveAllConfig() {
            const btn = document.getElementById('btn-save');
            btn.disabled = true;
            btn.textContent = '保存中...';

            const vectorDbs = collectVectorDBs();

            // 校验
            for (const db of vectorDbs) {
                if (!db.id) {
                    showToast('向量数据库配置必须填写 ID', 'error');
                    btn.disabled = false;
                    btn.textContent = '💾 保存配置';
                    return;
                }
            }

            const payload = {
                mineru: {
                    url: document.getElementById('mineru-url').value.trim(),
                    key: document.getElementById('mineru-key').value.trim(),
                    max_tasks: parseInt(document.getElementById('mineru-max-tasks').value) || 3,
                },
                ollama: {
                    url: document.getElementById('ollama-url').value.trim(),
                    key: document.getElementById('ollama-key').value.trim(),
                    model: document.getElementById('ollama-model').value.trim(),
                    embed_model: document.getElementById('ollama-embed-model').value.trim(),
                },
                vector_dbs: vectorDbs,
                upload_token: document.getElementById('upload-token').value.trim(),
                max_concurrent_tasks: parseInt(document.getElementById('max-concurrent').value) || 3,
                database_url: document.getElementById('database-url').value.trim(),
                uploads_folder: document.getElementById('uploads-folder').value.trim(),
            };

            try {
                const result = await api.put('/assist/api/config', payload);
                showToast('配置已保存', 'success');
                currentConfig = result.config;
            } catch (err) {
                showToast('保存失败: ' + err.message, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = '💾 保存配置';
            }
        }

        async function reloadConfig() {
            try {
                const result = await api.post('/assist/api/config/reload');
                currentConfig = result.config;
                fillForm(result.config);
                showToast('配置已重新加载', 'success');
            } catch (err) {
                showToast('重新加载失败: ' + err.message, 'error');
            }
        }

        init();
    </script>
</body>
</html>
