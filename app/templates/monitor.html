<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务监控 - OKB-Assist</title>
    <link rel="stylesheet" href="/assist/static/style.css">
    <style>
        .monitor-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .monitor-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.25rem;
            text-align: center;
        }
        .monitor-card h3 {
            font-size: 2rem;
            margin: 0.5rem 0;
        }
        .monitor-card p {
            color: var(--text-muted);
            font-size: 0.8rem;
            margin: 0;
        }
        .auto-refresh {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
        }
        .status-bar {
            height: 24px;
            background: var(--bg);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            margin-bottom: 0.5rem;
        }
        .status-bar-segment {
            height: 100%;
            transition: width 0.3s;
            position: relative;
        }
        .status-bar-segment:hover {
            opacity: 0.8;
        }
        .status-legend {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            font-size: 0.75rem;
        }
        .status-legend-item {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }
        .status-legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        .task-list {
            max-height: 300px;
            overflow-y: auto;
        }
        .task-item {
            display: flex;
            align-items: center;
            padding: 0.75rem;
            border-bottom: 1px solid var(--border);
            font-size: 0.875rem;
        }
        .task-item:last-child {
            border-bottom: none;
        }
        .task-info {
            flex: 1;
            min-width: 0;
        }
        .task-title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 500;
        }
        .task-meta {
            color: var(--text-muted);
            font-size: 0.75rem;
            margin-top: 0.25rem;
        }
        .service-card {
            padding: 1rem;
            background: var(--bg);
            border-radius: 8px;
        }
        .service-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }
        .service-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.5rem;
            margin-top: 0.75rem;
        }
        .service-stat {
            background: var(--card);
            border-radius: 6px;
            padding: 0.5rem;
            text-align: center;
        }
        .service-stat .value {
            font-size: 1.1rem;
            font-weight: 600;
        }
        .service-stat .label {
            font-size: 0.65rem;
            color: var(--text-muted);
        }
        .error-item {
            background: #fee2e2;
            border-left: 3px solid var(--danger);
            padding: 0.75rem;
            margin-bottom: 0.5rem;
            border-radius: 0 4px 4px 0;
        }
        .error-title {
            font-weight: 500;
            color: #991b1b;
            font-size: 0.875rem;
        }
        .error-message {
            color: #7f1d1d;
            font-size: 0.75rem;
            margin-top: 0.25rem;
            word-break: break-all;
        }
        .tabs {
            display: flex;
            gap: 0;
            border-bottom: 2px solid var(--border);
            margin-bottom: 1rem;
        }
        .tab {
            padding: 0.75rem 1.25rem;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            font-size: 0.875rem;
            color: var(--text-muted);
            transition: all 0.2s;
        }
        .tab:hover {
            color: var(--text);
        }
        .tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>📚 OKB-Assist</h1>
            <nav id="nav"></nav>
        </div>
    </header>

    <main class="container">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem">
            <h2>任务监控</h2>
            <div class="auto-refresh">
                <label>
                    <input type="checkbox" id="auto-refresh" checked onchange="toggleAutoRefresh()">
                    自动刷新
                </label>
                <span id="refresh-countdown" style="color:var(--text-muted)">3s</span>
            </div>
        </div>

        <!-- Queue Status -->
        <div class="monitor-grid">
            <div class="monitor-card">
                <p>总文献数</p>
                <h3 id="total-docs">-</h3>
            </div>
            <div class="monitor-card">
                <p>已索引</p>
                <h3 id="indexed-docs" style="color:var(--success)">-</h3>
            </div>
            <div class="monitor-card">
                <p>处理中</p>
                <h3 id="processing-docs" style="color:var(--primary)">-</h3>
            </div>
            <div class="monitor-card">
                <p>待处理</p>
                <h3 id="pending-docs" style="color:var(--warning)">-</h3>
            </div>
            <div class="monitor-card">
                <p>错误</p>
                <h3 id="error-docs" style="color:var(--danger)">-</h3>
            </div>
            <div class="monitor-card">
                <p>运行中任务</p>
                <h3 id="running-tasks">-</h3>
            </div>
        </div>

        <!-- Status Distribution Bar -->
        <div class="card" style="margin-bottom:1.5rem">
            <h3 style="margin-bottom:1rem">状态分布</h3>
            <div id="status-bar" class="status-bar"></div>
            <div id="status-legend" class="status-legend"></div>
        </div>

        <!-- Tabs for Tasks -->
        <div class="card" style="margin-bottom:1.5rem">
            <div class="tabs">
                <div class="tab active" onclick="switchTab('processing')">处理中</div>
                <div class="tab" onclick="switchTab('pending')">待处理</div>
                <div class="tab" onclick="switchTab('errors')">错误</div>
                <div class="tab" onclick="switchTab('recent')">最近完成</div>
            </div>

            <div id="tab-processing" class="tab-content active">
                <div id="processing-list" class="task-list">
                    <p style="text-align:center;color:var(--text-muted);padding:2rem">加载中...</p>
                </div>
            </div>

            <div id="tab-pending" class="tab-content">
                <div id="pending-list" class="task-list">
                    <p style="text-align:center;color:var(--text-muted);padding:2rem">加载中...</p>
                </div>
            </div>

            <div id="tab-errors" class="tab-content">
                <div id="errors-list" class="task-list">
                    <p style="text-align:center;color:var(--text-muted);padding:2rem">加载中...</p>
                </div>
            </div>

            <div id="tab-recent" class="tab-content">
                <div id="recent-list" class="task-list">
                    <p style="text-align:center;color:var(--text-muted);padding:2rem">加载中...</p>
                </div>
            </div>
        </div>

        <!-- Services Status -->
        <div class="card" style="margin-bottom:1.5rem">
            <h3 style="margin-bottom:1rem">服务状态</h3>
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1rem">
                <!-- MinerU -->
                <div class="service-card">
                    <div class="service-header">
                        <strong>📄 MinerU (PDF解析)</strong>
                        <span id="mineru-status" class="badge">检查中...</span>
                    </div>
                    <p style="font-size:0.75rem;color:var(--text-muted);margin:0" id="mineru-url">-</p>
                    <p style="font-size:0.75rem;color:var(--text-muted);margin:0.25rem 0 0 0" id="mineru-version">-</p>
                    <div class="service-stats" id="mineru-stats" style="display:none">
                        <div class="service-stat">
                            <div class="value" id="mineru-processing" style="color:var(--warning)">0</div>
                            <div class="label">处理中</div>
                        </div>
                        <div class="service-stat">
                            <div class="value" id="mineru-queued">0</div>
                            <div class="label">排队中</div>
                        </div>
                        <div class="service-stat">
                            <div class="value" id="mineru-completed" style="color:var(--success)">0</div>
                            <div class="label">已完成</div>
                        </div>
                        <div class="service-stat">
                            <div class="value" id="mineru-failed" style="color:var(--danger)">0</div>
                            <div class="label">失败</div>
                        </div>
                    </div>
                </div>
                <!-- Ollama -->
                <div class="service-card">
                    <div class="service-header">
                        <strong>🤖 Ollama (AI模型)</strong>
                        <span id="ollama-status" class="badge">检查中...</span>
                    </div>
                    <p style="font-size:0.75rem;color:var(--text-muted);margin:0" id="ollama-url">-</p>
                    <p style="font-size:0.75rem;color:var(--text-muted);margin:0.25rem 0 0 0" id="ollama-info">-</p>
                </div>
                <!-- Qdrant -->
                <div class="service-card">
                    <div class="service-header">
                        <strong>🔍 Qdrant (向量数据库)</strong>
                        <span id="qdrant-status" class="badge">检查中...</span>
                    </div>
                    <p style="font-size:0.75rem;color:var(--text-muted);margin:0" id="qdrant-url">-</p>
                    <p style="font-size:0.75rem;color:var(--text-muted);margin:0.25rem 0 0 0" id="qdrant-info">-</p>
                </div>
            </div>
        </div>
    </main>

    <script src="/assist/static/app.js"></script>
    <script>
        let refreshTimer = null;
        let countdown = 3;
        let autoRefresh = true;
        let allDocs = [];

        // Status colors
        const STATUS_COLORS = {
            'uploaded': '#94a3b8',
            'parsing': '#3b82f6',
            'markdown_done': '#8b5cf6',
            'extracting': '#f59e0b',
            'meta_done': '#10b981',
            'indexing': '#06b6d4',
            'indexed': '#22c55e',
            'error': '#ef4444',
        };

        const STATUS_LABELS = {
            'uploaded': '已上传',
            'parsing': '解析中',
            'markdown_done': '已解析',
            'extracting': '提取中',
            'meta_done': '已提取',
            'indexing': '索引中',
            'indexed': '已索引',
            'error': '错误',
        };

        function toggleAutoRefresh() {
            autoRefresh = document.getElementById('auto-refresh').checked;
            if (autoRefresh) {
                startAutoRefresh();
            } else {
                stopAutoRefresh();
            }
        }

        function startAutoRefresh() {
            countdown = 3;
            refreshTimer = setInterval(() => {
                countdown--;
                document.getElementById('refresh-countdown').textContent = `${countdown}s`;
                if (countdown <= 0) {
                    loadData();
                    countdown = 3;
                }
            }, 1000);
        }

        function stopAutoRefresh() {
            if (refreshTimer) {
                clearInterval(refreshTimer);
                refreshTimer = null;
            }
            document.getElementById('refresh-countdown').textContent = '已暂停';
        }

        function switchTab(tabName) {
            // Update tab buttons
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');

            // Update tab content
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.getElementById(`tab-${tabName}`).classList.add('active');
        }

        async function loadData() {
            try {
                // Load queue status
                const queue = await api.get('/assist/api/pipeline/queue/status');
                document.getElementById('running-tasks').textContent = `${queue.running_tasks}/${queue.max_concurrent_tasks}`;

                // Load documents
                const data = await api.get('/assist/api/documents/?page_size=10000');
                allDocs = data.items || [];
                document.getElementById('total-docs').textContent = data.total;

                // Calculate status counts
                const statusCounts = {};
                Object.keys(STATUS_LABELS).forEach(s => statusCounts[s] = 0);
                allDocs.forEach(doc => {
                    statusCounts[doc.status] = (statusCounts[doc.status] || 0) + 1;
                });

                // Update summary cards
                document.getElementById('indexed-docs').textContent = statusCounts['indexed'] || 0;
                document.getElementById('processing-docs').textContent = (statusCounts['parsing'] || 0) + (statusCounts['extracting'] || 0) + (statusCounts['indexing'] || 0);
                document.getElementById('pending-docs').textContent = (statusCounts['uploaded'] || 0) + (statusCounts['markdown_done'] || 0) + (statusCounts['meta_done'] || 0);
                document.getElementById('error-docs').textContent = statusCounts['error'] || 0;

                // Render status bar
                renderStatusBar(statusCounts);

                // Render task lists
                renderProcessingList();
                renderPendingList();
                renderErrorsList();
                renderRecentList();

                // Load services status
                await loadServicesStatus();

            } catch (err) {
                console.error('Load error:', err);
            }
        }

        function renderStatusBar(statusCounts) {
            const total = Object.values(statusCounts).reduce((a, b) => a + b, 0);
            if (total === 0) {
                document.getElementById('status-bar').innerHTML = '';
                document.getElementById('status-legend').innerHTML = '<span style="color:var(--text-muted)">暂无数据</span>';
                return;
            }

            // Build status bar
            let barHtml = '';
            let legendHtml = '';

            Object.entries(STATUS_LABELS).forEach(([status, label]) => {
                const count = statusCounts[status] || 0;
                if (count > 0) {
                    const percent = (count / total * 100).toFixed(1);
                    barHtml += `<div class="status-bar-segment" style="width:${percent}%;background:${STATUS_COLORS[status]}" title="${label}: ${count} (${percent}%)"></div>`;
                    legendHtml += `
                        <div class="status-legend-item">
                            <div class="status-legend-dot" style="background:${STATUS_COLORS[status]}"></div>
                            <span>${label}: ${count}</span>
                        </div>
                    `;
                }
            });

            document.getElementById('status-bar').innerHTML = barHtml;
            document.getElementById('status-legend').innerHTML = legendHtml;
        }

        function renderProcessingList() {
            const processing = allDocs.filter(d => ['parsing', 'extracting', 'indexing'].includes(d.status));
            const container = document.getElementById('processing-list');

            if (processing.length === 0) {
                container.innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:2rem">暂无处理中的任务</p>';
                return;
            }

            container.innerHTML = processing.map(doc => `
                <div class="task-item">
                    <div class="task-info">
                        <div class="task-title">${doc.title || doc.filename || '未命名'}</div>
                        <div class="task-meta">ID: ${doc.id} · 状态: ${STATUS_LABELS[doc.status] || doc.status}</div>
                    </div>
                    <a href="/assist/doc/${doc.id}" class="btn btn-sm">查看</a>
                </div>
            `).join('');
        }

        function renderPendingList() {
            const pending = allDocs.filter(d => ['uploaded', 'markdown_done', 'meta_done'].includes(d.status));
            const container = document.getElementById('pending-list');

            if (pending.length === 0) {
                container.innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:2rem">暂无待处理任务</p>';
                return;
            }

            container.innerHTML = pending.map(doc => `
                <div class="task-item">
                    <div class="task-info">
                        <div class="task-title">${doc.title || doc.filename || '未命名'}</div>
                        <div class="task-meta">ID: ${doc.id} · 状态: ${STATUS_LABELS[doc.status] || doc.status}</div>
                    </div>
                    <a href="/assist/doc/${doc.id}" class="btn btn-sm">处理</a>
                </div>
            `).join('');
        }

        function renderErrorsList() {
            const errors = allDocs.filter(d => d.status === 'error');
            const container = document.getElementById('errors-list');

            if (errors.length === 0) {
                container.innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:2rem">暂无错误任务</p>';
                return;
            }

            container.innerHTML = errors.map(doc => `
                <div class="error-item">
                    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:0.5rem">
                        <div>
                            <div class="error-title">${doc.title || doc.filename || '未命名'}</div>
                            <div class="error-message">${doc.status_message || '未知错误'}</div>
                            <div class="task-meta" style="margin-top:0.25rem">ID: ${doc.id}</div>
                        </div>
                        <a href="/assist/doc/${doc.id}" class="btn btn-sm">处理</a>
                    </div>
                </div>
            `).join('');
        }

        function renderRecentList() {
            const recent = allDocs
                .filter(d => d.status === 'indexed')
                .sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at))
                .slice(0, 20);
            const container = document.getElementById('recent-list');

            if (recent.length === 0) {
                container.innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:2rem">暂无已完成任务</p>';
                return;
            }

            container.innerHTML = recent.map(doc => {
                const time = doc.updated_at ? new Date(doc.updated_at).toLocaleString('zh-CN') : '-';
                return `
                    <div class="task-item">
                        <div class="task-info">
                            <div class="task-title">${doc.title || doc.filename || '未命名'}</div>
                            <div class="task-meta">ID: ${doc.id} · 完成时间: ${time}</div>
                        </div>
                        <a href="/assist/detail/${doc.id}" class="btn btn-sm">查看</a>
                    </div>
                `;
            }).join('');
        }

        async function loadServicesStatus() {
            try {
                const services = await api.get('/assist/api/admin/services/status');

                // MinerU
                const mineru = services.mineru || {};
                document.getElementById('mineru-url').textContent = mineru.url || '-';
                document.getElementById('mineru-status').className = `badge badge-${mineru.status === 'connected' ? 'indexed' : 'error'}`;
                document.getElementById('mineru-status').textContent = mineru.status === 'connected' ? '✓ 已连接' : '✗ 未连接';

                const statsEl = document.getElementById('mineru-stats');
                if (mineru.status === 'connected') {
                    document.getElementById('mineru-version').textContent = `版本: ${mineru.version || 'unknown'} · 最大并发: ${mineru.max_concurrent || '-'}`;
                    document.getElementById('mineru-processing').textContent = mineru.processing_tasks || 0;
                    document.getElementById('mineru-queued').textContent = mineru.queued_tasks || 0;
                    document.getElementById('mineru-completed').textContent = mineru.completed_tasks || 0;
                    document.getElementById('mineru-failed').textContent = mineru.failed_tasks || 0;
                    statsEl.style.display = 'grid';
                } else {
                    document.getElementById('mineru-version').textContent = mineru.error || '';
                    statsEl.style.display = 'none';
                }

                // Ollama
                const ollama = services.ollama || {};
                document.getElementById('ollama-url').textContent = ollama.url || '-';
                document.getElementById('ollama-status').className = `badge badge-${ollama.status === 'connected' ? 'indexed' : 'error'}`;
                document.getElementById('ollama-status').textContent = ollama.status === 'connected' ? '✓ 已连接' : '✗ 未连接';
                document.getElementById('ollama-info').textContent = ollama.models ? `模型: ${ollama.models.join(', ')}` : (ollama.error || '');

                // Qdrant
                const qdrant = services.qdrant || {};
                document.getElementById('qdrant-url').textContent = qdrant.url || '-';
                document.getElementById('qdrant-status').className = `badge badge-${qdrant.status === 'connected' ? 'indexed' : 'error'}`;
                document.getElementById('qdrant-status').textContent = qdrant.status === 'connected' ? '✓ 已连接' : '✗ 未连接';
                document.getElementById('qdrant-info').textContent = qdrant.collections ? `集合: ${qdrant.collections.join(', ')}` : (qdrant.error || '');

            } catch (err) {
                console.error('Services status error:', err);
            }
        }

        // Initial load
        loadData();
        startAutoRefresh();
    </script>
</body>
</html>
