<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - OKB-Assist</title>
    <link rel="stylesheet" href="/assist/static/style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>📚 OKB-Assist</h1>
            <nav id="nav"></nav>
        </div>
    </header>

    <main class="container">
        <div class="auth-container">
            <div class="card">
                <h2 id="auth-title">登录</h2>
                <form id="auth-form">
                    <div class="form-group">
                        <label for="username">用户名</label>
                        <input type="text" id="username" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="password">密码</label>
                        <input type="password" id="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width:100%">登录</button>
                </form>
                <div class="auth-toggle">
                    <span id="toggle-text">没有账户？</span>
                    <a href="#" id="toggle-link" onclick="toggleMode()">注册</a>
                </div>
            </div>
        </div>
    </main>

    <script src="/assist/static/app.js"></script>
    <script>
        let isLogin = true;

        function toggleMode() {
            isLogin = !isLogin;
            document.getElementById('auth-title').textContent = isLogin ? '登录' : '注册';
            document.getElementById('toggle-text').textContent = isLogin ? '没有账户？' : '已有账户？';
            document.getElementById('toggle-link').textContent = isLogin ? '注册' : '登录';
            document.querySelector('button[type="submit"]').textContent = isLogin ? '登录' : '注册';
        }

        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                if (isLogin) {
                    // Login
                    const formData = new URLSearchParams();
                    formData.append('username', username);
                    formData.append('password', password);

                    const res = await fetch('/assist/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: formData,
                    });

                    if (!res.ok) {
                        const err = await res.json();
                        throw new Error(err.detail || '登录失败');
                    }

                    const data = await res.json();
                    api.setToken(data.access_token);
                    showToast('登录成功', 'success');
                    setTimeout(() => window.location.href = '/assist/', 500);
                } else {
                    // Register
                    const data = await api.post('/assist/api/auth/register', { username, password });
                    showToast('注册成功，请登录', 'success');
                    toggleMode();
                }
            } catch (err) {
                showToast(err.message, 'error');
            }
        });

        // If already logged in, redirect
        if (api.token) {
            window.location.href = '/assist/';
        }
    </script>
</body>
</html>
