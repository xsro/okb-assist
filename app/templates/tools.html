<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工具面板 - OKB-Assist</title>
    <link rel="stylesheet" href="/assist/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .tools-layout {
            display: flex;
            gap: 1.5rem;
            min-height: calc(100vh - 120px);
        }
        .tools-sidebar {
            width: 220px;
            flex-shrink: 0;
        }
        .tools-main {
            flex: 1;
            min-width: 0;
        }
        .tool-nav {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }
        .tool-nav-item {
            padding: 0.75rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--text-muted);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .tool-nav-item:hover {
            background: var(--bg);
            color: var(--text);
        }
        .tool-nav-item.active {
            background: var(--primary);
            color: white;
        }
        .tool-panel {
            display: none;
        }
        .tool-panel.active {
            display: block;
        }
        /* Search panel */
        .search-input-group {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }
        .search-input-group input {
            flex: 1;
            font-size: 1rem;
            padding: 0.75rem 1rem;
        }
        .search-result-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem 1.25rem;
            margin-bottom: 0.75rem;
            transition: border-color 0.2s;
        }
        .search-result-card:hover {
            border-color: var(--primary);
        }
        .search-result-score {
            float: right;
            background: var(--primary);
            color: white;
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .search-result-title {
            font-weight: 600;
            margin-bottom: 0.25rem;
        }
        .search-result-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }
        .search-result-text {
            font-size: 0.85rem;
            color: var(--text);
            line-height: 1.5;
            max-height: 100px;
            overflow: hidden;
            position: relative;
        }
        .search-result-text.expanded {
            max-height: none;
        }
        .search-result-actions {
            margin-top: 0.5rem;
            display: flex;
            gap: 0.5rem;
        }
        /* Document list */
        .doc-list-item {
            display: flex;
            align-items: center;
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.2s;
        }
        .doc-list-item:hover {
            background: var(--bg);
        }
        .doc-list-item.selected {
            background: rgba(37, 99, 235, 0.08);
            border-left: 3px solid var(--primary);
        }
        .doc-list-info {
            flex: 1;
            min-width: 0;
        }
        .doc-list-title {
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .doc-list-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        /* Info panel */
        .info-grid {
            display: grid;
            grid-template-columns: 120px 1fr;
            gap: 0.5rem 1rem;
            font-size: 0.9rem;
        }
        .info-label {
            color: var(--text-muted);
            font-weight: 500;
        }
        .info-value {
            word-break: break-all;
        }
        /* Markdown viewer */
        .md-viewer {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
            max-height: 70vh;
            overflow-y: auto;
            line-height: 1.8;
        }
        .md-viewer h1, .md-viewer h2, .md-viewer h3 {
            margin-top: 1.5rem;
            margin-bottom: 0.5rem;
        }
        .md-viewer img {
            max-width: 100%;
            border-radius: 4px;
        }
        .md-viewer pre {
            background: var(--bg);
            padding: 1rem;
            border-radius: 6px;
            overflow-x: auto;
        }
        .md-viewer table {
            width: 100%;
            border-collapse: collapse;
            margin: 1rem 0;
        }
        .md-viewer th, .md-viewer td {
            border: 1px solid var(--border);
            padding: 0.5rem;
        }
        .md-pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            margin-top: 1rem;
        }
        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
        }
        .empty-state .icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        /* Loading */
        .loading {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
        }
        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-left: 0.5rem;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        /* Filter bar */
        .filter-bar {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1rem;
            align-items: center;
        }
        .filter-bar input, .filter-bar select {
            padding: 0.5rem 0.75rem;
            font-size: 0.85rem;
        }
        .filter-bar input {
            flex: 1;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>🛠️ 工具面板</h1>
            <nav id="nav"></nav>
        </div>
    </header>

    <div class="container">
        <div class="tools-layout">
            <!-- Sidebar -->
            <div class="tools-sidebar">
                <div class="card">
                    <div class="tool-nav">
                        <div class="tool-nav-item active" data-tool="search" onclick="switchTool('search')">
                            🔍 语义搜索
                        </div>
                        <div class="tool-nav-item" data-tool="browse" onclick="switchTool('browse')">
                            📚 文档浏览
                        </div>
                        <div class="tool-nav-item" data-tool="reader" onclick="switchTool('reader')">
                            📖 Markdown 阅读
                        </div>
                        <div class="tool-nav-item" data-tool="info" onclick="switchTool('info')">
                            📋 文档信息
                        </div>
                    </div>
                </div>
                <div class="card" style="margin-top: 1rem;">
                    <h4 style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.5rem;">MCP 连接</h4>
                    <p style="font-size: 0.8rem; color: var(--text-muted); line-height: 1.5;">
                        此工具面板也可通过 MCP 协议供 AI 助手使用。SSE 端点：<br>
                        <code style="background: var(--bg); padding: 0.15rem 0.4rem; border-radius: 3px; font-size: 0.75rem;">/assist/mcp/sse</code>
                    </p>
                    <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 0.5rem;">
                        <a href="https://github.com/modelcontextprotocol" target="_blank">配置教程</a>
                    </p>
                </div>
            </div>

            <!-- Main content -->
            <div class="tools-main">
                <!-- Search Panel -->
                <div class="tool-panel active" id="panel-search">
                    <div class="card">
                        <h2 style="margin-bottom: 1rem;">🔍 语义搜索</h2>
                        <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1rem;">
                            使用向量数据库进行语义相似度搜索，支持中英文查询
                        </p>
                        <div class="search-input-group">
                            <input type="text" id="searchQuery" class="form-control"
                                   placeholder="输入搜索内容，如：机器学习优化算法..."
                                   onkeydown="if(event.key==='Enter') doSearch()">
                            <select id="searchLimit" class="form-control" style="width: 80px;">
                                <option value="5">5条</option>
                                <option value="10">10条</option>
                                <option value="20">20条</option>
                            </select>
                            <button class="btn btn-primary" onclick="doSearch()">搜索</button>
                        </div>
                        <div id="searchResults">
                            <div class="empty-state">
                                <div class="icon">🔍</div>
                                <p>输入关键词开始搜索</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Browse Panel -->
                <div class="tool-panel" id="panel-browse">
                    <div class="card">
                        <h2 style="margin-bottom: 1rem;">📚 文档浏览</h2>
                        <div class="filter-bar">
                            <input type="text" id="browseQuery" class="form-control"
                                   placeholder="搜索标题、作者、文件名..."
                                   onkeydown="if(event.key==='Enter') doBrowse()">
                            <select id="browseStatus" class="form-control" style="width: 140px;">
                                <option value="">全部状态</option>
                                <option value="indexed">已索引</option>
                                <option value="meta_done">已提取</option>
                                <option value="markdown_done">已解析</option>
                                <option value="uploaded">已上传</option>
                                <option value="error">错误</option>
                            </select>
                            <button class="btn btn-primary" onclick="doBrowse()">搜索</button>
                        </div>
                        <div id="browseResults">
                            <div class="loading">加载中</div>
                        </div>
                        <div id="browsePagination" style="display: flex; justify-content: center; gap: 0.5rem; margin-top: 1rem;"></div>
                    </div>
                </div>

                <!-- Reader Panel -->
                <div class="tool-panel" id="panel-reader">
                    <div class="card">
                        <h2 style="margin-bottom: 1rem;">📖 Markdown 阅读</h2>
                        <div class="filter-bar">
                            <input type="number" id="readerDocId" class="form-control"
                                   placeholder="输入文档 ID" style="width: 150px;">
                            <button class="btn btn-primary" onclick="loadMarkdown()">加载</button>
                        </div>
                        <div id="readerContent">
                            <div class="empty-state">
                                <div class="icon">📖</div>
                                <p>输入文档 ID 加载 Markdown 内容</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Info Panel -->
                <div class="tool-panel" id="panel-info">
                    <div class="card">
                        <h2 style="margin-bottom: 1rem;">📋 文档信息</h2>
                        <div class="filter-bar">
                            <input type="number" id="infoDocId" class="form-control"
                                   placeholder="输入文档 ID" style="width: 150px;">
                            <button class="btn btn-primary" onclick="loadDocInfo()">查询</button>
                        </div>
                        <div id="infoContent">
                            <div class="empty-state">
                                <div class="icon">📋</div>
                                <p>输入文档 ID 查看详细信息</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/assist/static/app.js"></script>
    <script>
        // Tool switching
        function switchTool(name) {
            document.querySelectorAll('.tool-nav-item').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tool-panel').forEach(el => el.classList.remove('active'));
            document.querySelector(`[data-tool="${name}"]`).classList.add('active');
            document.getElementById(`panel-${name}`).classList.add('active');

            // Auto-load for browse
            if (name === 'browse' && !document.querySelector('#browseResults .doc-list-item')) {
                doBrowse();
            }
        }

        // ─── Search ──────────────────────────────────────────────────────────
        async function doSearch() {
            const query = document.getElementById('searchQuery').value.trim();
            const limit = parseInt(document.getElementById('searchLimit').value);
            if (!query) return;

            const container = document.getElementById('searchResults');
            container.innerHTML = '<div class="loading">搜索中</div>';

            try {
                const data = await api.get(`/assist/api/documents/search?q=${encodeURIComponent(query)}&limit=${limit}`);
                if (!data.results || data.results.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="icon">😔</div>
                            <p>未找到与 "${query}" 相关的结果</p>
                        </div>`;
                    return;
                }

                container.innerHTML = data.results.map((r, i) => `
                    <div class="search-result-card">
                        <span class="search-result-score">${(r.score * 100).toFixed(1)}%</span>
                        <div class="search-result-title">${r.title || r.filename || `文档 #${r.document_id}`}</div>
                        <div class="search-result-meta">
                            ID: ${r.document_id}
                            ${r.authors ? ' · ' + r.authors : ''}
                            ${r.year ? ' · ' + r.year : ''}
                            ${r.journal ? ' · ' + r.journal : ''}
                        </div>
                        <div class="search-result-text">${escapeHtml(r.chunk_text || '')}</div>
                        <div class="search-result-actions">
                            <a href="/assist/detail/${r.document_id}" class="btn btn-sm btn-primary">详情</a>
                            <a href="/assist/markdown/${r.document_id}" class="btn btn-sm btn-success">阅读</a>
                            ${r.pdf_url ? `<a href="${r.pdf_url}" target="_blank" class="btn btn-sm btn-warning">PDF</a>` : ''}
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                container.innerHTML = `<div class="empty-state"><p style="color:var(--danger)">搜索失败: ${e.message}</p></div>`;
            }
        }

        // ─── Browse ──────────────────────────────────────────────────────────
        let browsePage = 1;
        let browseTotalPages = 1;

        async function doBrowse(page = 1) {
            browsePage = page;
            const query = document.getElementById('browseQuery').value.trim();
            const status = document.getElementById('browseStatus').value;
            const container = document.getElementById('browseResults');

            container.innerHTML = '<div class="loading">加载中</div>';

            try {
                let url = `/assist/api/documents/?page=${page}&page_size=20`;
                if (query) url += `&q=${encodeURIComponent(query)}`;
                if (status) url += `&status_filter=${status}`;

                const data = await api.get(url);
                browseTotalPages = data.total_pages;

                if (!data.items || data.items.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="icon">📭</div>
                            <p>暂无文档</p>
                        </div>`;
                    document.getElementById('browsePagination').innerHTML = '';
                    return;
                }

                container.innerHTML = data.items.map(doc => `
                    <div class="doc-list-item" onclick="selectDoc(${doc.id}, '${escapeAttr(doc.title || doc.filename)}')">
                        <div class="doc-list-info">
                            <div class="doc-list-title">${doc.title || doc.filename}</div>
                            <div class="doc-list-meta">
                                ID: ${doc.id}
                                ${doc.authors ? ' · ' + doc.authors : ''}
                                ${doc.year ? ' · ' + doc.year : ''}
                                · ${statusBadge(doc.status)}
                            </div>
                        </div>
                        <div style="display:flex; gap:0.5rem;">
                            <a href="/assist/detail/${doc.id}" class="btn btn-sm btn-primary" onclick="event.stopPropagation()">详情</a>
                        </div>
                    </div>
                `).join('');

                // Pagination
                const pag = document.getElementById('browsePagination');
                pag.innerHTML = `
                    <button class="btn btn-sm" ${page <= 1 ? 'disabled' : ''} onclick="doBrowse(${page - 1})">上一页</button>
                    <span style="font-size:0.85rem; color:var(--text-muted);">第 ${page} / ${browseTotalPages} 页 (共 ${data.total} 条)</span>
                    <button class="btn btn-sm" ${page >= browseTotalPages ? 'disabled' : ''} onclick="doBrowse(${page + 1})">下一页</button>
                `;
            } catch (e) {
                container.innerHTML = `<div class="empty-state"><p style="color:var(--danger)">加载失败: ${e.message}</p></div>`;
            }
        }

        function selectDoc(docId, title) {
            // Switch to reader and load
            document.getElementById('readerDocId').value = docId;
            document.getElementById('infoDocId').value = docId;
            switchTool('reader');
            loadMarkdown();
        }

        // ─── Reader ──────────────────────────────────────────────────────────
        let mdPage = 1;
        let mdTotalPages = 1;
        let currentMdDocId = null;

        async function loadMarkdown(page = 1) {
            const docId = document.getElementById('readerDocId').value;
            if (!docId) return;

            currentMdDocId = docId;
            mdPage = page;
            const container = document.getElementById('readerContent');
            container.innerHTML = '<div class="loading">加载中</div>';

            try {
                const data = await api.get(`/assist/api/documents/${docId}/markdown?page=${page}&page_size=15000`);
                mdTotalPages = data.total_pages;

                const html = marked.parse(data.content || '');
                container.innerHTML = `
                    <div style="margin-bottom: 0.5rem; font-size: 0.85rem; color: var(--text-muted);">
                        文档 #${docId} · 共 ${data.total_length} 字符
                    </div>
                    <div class="md-viewer">${html}</div>
                    ${mdTotalPages > 1 ? `
                    <div class="md-pagination">
                        <button class="btn btn-sm" ${page <= 1 ? 'disabled' : ''} onclick="loadMarkdown(${page - 1})">上一页</button>
                        <span style="font-size:0.85rem; color:var(--text-muted);">第 ${page} / ${mdTotalPages} 页</span>
                        <button class="btn btn-sm" ${page >= mdTotalPages ? 'disabled' : ''} onclick="loadMarkdown(${page + 1})">下一页</button>
                    </div>` : ''}
                `;
            } catch (e) {
                container.innerHTML = `<div class="empty-state"><p style="color:var(--danger)">加载失败: ${e.message}</p></div>`;
            }
        }

        // ─── Info ────────────────────────────────────────────────────────────
        async function loadDocInfo() {
            const docId = document.getElementById('infoDocId').value;
            if (!docId) return;

            const container = document.getElementById('infoContent');
            container.innerHTML = '<div class="loading">加载中</div>';

            try {
                const doc = await api.get(`/assist/api/documents/${docId}`);
                const rows = [
                    ['ID', doc.id],
                    ['文件名', doc.filename],
                    ['标题', doc.title],
                    ['作者', doc.authors],
                    ['年份', doc.year],
                    ['DOI', doc.doi ? `<a href="https://doi.org/${doc.doi}" target="_blank">${doc.doi}</a>` : '-'],
                    ['期刊', doc.journal],
                    ['关键词', doc.keywords],
                    ['分类', doc.category],
                    ['类型', doc.doc_type],
                    ['语言', doc.language],
                    ['状态', statusBadge(doc.status)],
                    ['创建时间', doc.created_at ? new Date(doc.created_at).toLocaleString('zh-CN') : '-'],
                ];

                if (doc.abstract) {
                    rows.push(['摘要', `<div style="max-height:200px;overflow-y:auto;line-height:1.6;">${doc.abstract}</div>`]);
                }

                container.innerHTML = `
                    <div class="info-grid">
                        ${rows.map(([label, value]) => `
                            <div class="info-label">${label}</div>
                            <div class="info-value">${value || '-'}</div>
                        `).join('')}
                    </div>
                    <div style="margin-top: 1.5rem; display: flex; gap: 0.75rem;">
                        <a href="/assist/detail/${doc.id}" class="btn btn-primary">详情页</a>
                        <a href="/assist/markdown/${doc.id}" class="btn btn-success">阅读 Markdown</a>
                        <a href="/assist/api/documents/${doc.id}/pdf" target="_blank" class="btn btn-warning">打开 PDF</a>
                    </div>
                `;
            } catch (e) {
                container.innerHTML = `<div class="empty-state"><p style="color:var(--danger)">加载失败: ${e.message}</p></div>`;
            }
        }

        // ─── Utils ───────────────────────────────────────────────────────────
        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function escapeAttr(str) {
            return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }

        // Auto-load browse on first visit
        document.addEventListener('DOMContentLoaded', () => {
            doBrowse();
        });
    </script>
</body>
</html>
