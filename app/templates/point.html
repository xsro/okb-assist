<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Point 查看器 - OKB-Assist</title>
    <link rel="stylesheet" href="/assist/static/style.css">
    <style>
        .point-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .search-box {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .search-box input {
            flex: 1;
        }
        .search-box select {
            width: 200px;
        }
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }
        @media (max-width: 768px) {
            .info-grid {
                grid-template-columns: 1fr;
            }
            .action-buttons {
                flex-wrap: wrap;
            }
        }
        .info-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
        }
        .info-card h3 {
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border);
        }
        .metadata-table {
            width: 100%;
        }
        .metadata-table td {
            padding: 0.5rem 0;
            border-bottom: 1px solid var(--border);
        }
        .metadata-table td:first-child {
            font-weight: 600;
            width: 120px;
            color: var(--text-muted);
        }
        .vector-info {
            font-size: 0.875rem;
            color: var(--text-muted);
        }
        .vector-preview {
            background: var(--bg);
            padding: 1rem;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.75rem;
            max-height: 150px;
            overflow-y: auto;
            word-break: break-all;
        }
        .text-preview {
            background: var(--bg);
            padding: 1rem;
            border-radius: 6px;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            line-height: 1.6;
        }
        .action-buttons {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }
        .json-viewer {
            background: var(--bg);
            padding: 1rem;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.75rem;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>📚 OKB-Assist</h1>
            <nav id="nav"></nav>
        </div>
    </header>

    <main class="container point-container">
        <h2 style="margin-bottom:1.5rem">Qdrant Point 查看器</h2>

        <!-- Search Box -->
        <div class="card">
            <div class="search-box">
                <input type="text" id="point-id" class="form-control" placeholder="输入 Point ID (UUID)">
                <select id="collection-select" class="form-control">
                    <option value="">选择集合</option>
                </select>
                <button class="btn btn-primary" onclick="loadPoint()">查询</button>
            </div>
        </div>

        <!-- Result -->
        <div id="result-container" style="display:none">
            <!-- Point Info -->
            <div class="info-grid">
                <!-- Metadata Card -->
                <div class="info-card">
                    <h3>📋 元数据</h3>
                    <div id="metadata-content"></div>
                    <div class="action-buttons action-row">
                        <a id="btn-view-doc" href="#" target="_blank" class="btn btn-sm btn-primary" style="display:none">查看文献详情</a>
                        <a id="btn-view-md" href="#" target="_blank" class="btn btn-sm" style="display:none">查看 Markdown</a>
                        <a id="btn-view-pdf" href="#" target="_blank" class="btn btn-sm" style="display:none">查看 PDF</a>
                    </div>
                </div>

                <!-- Vector Info Card -->
                <div class="info-card">
                    <h3>🔢 向量信息</h3>
                    <div id="vector-content"></div>
                </div>
            </div>

            <!-- Text Content -->
            <div class="info-card" style="margin-bottom:1.5rem">
                <h3>📝 文本内容</h3>
                <div id="text-content" class="text-preview"></div>
            </div>

            <!-- Raw JSON -->
            <div class="info-card">
                <h3>📦 原始 JSON</h3>
                <div id="json-content" class="json-viewer"></div>
            </div>
        </div>

        <!-- Error -->
        <div id="error-container" style="display:none">
            <div class="card" style="border-color:var(--danger)">
                <p id="error-message" style="color:var(--danger)"></p>
            </div>
        </div>
    </main>

    <script src="/assist/static/app.js"></script>
    <script>
        // Load collections on page load
        async function loadCollections() {
            try {
                const data = await api.get('/assist/api/admin/qdrant/collections');
                const select = document.getElementById('collection-select');
                data.collections.forEach(c => {
                    const option = document.createElement('option');
                    option.value = c;
                    option.textContent = c;
                    select.appendChild(option);
                });
                // Select first collection if available
                if (data.collections.length > 0) {
                    select.value = data.collections[0];
                }
            } catch (err) {
                console.error('Failed to load collections:', err);
            }
        }

        async function loadPoint() {
            const pointId = document.getElementById('point-id').value.trim();
            const collection = document.getElementById('collection-select').value;

            if (!pointId) {
                showToast('请输入 Point ID', 'error');
                return;
            }

            // Hide previous results
            document.getElementById('result-container').style.display = 'none';
            document.getElementById('error-container').style.display = 'none';

            try {
                let url = `/assist/api/admin/qdrant/point/${pointId}`;
                if (collection) {
                    url += `?collection=${encodeURIComponent(collection)}`;
                }

                const data = await api.get(url);
                renderPoint(data);
            } catch (err) {
                document.getElementById('error-message').textContent = err.message;
                document.getElementById('error-container').style.display = 'block';
            }
        }

        function renderPoint(data) {
            const container = document.getElementById('result-container');
            container.style.display = 'block';

            // Render metadata
            const metadata = data.payload?.metadata || {};
            const documentId = metadata.document_id;

            let metadataHtml = `
                <table class="metadata-table">
                    <tr><td>Point ID</td><td style="font-family:monospace;font-size:0.75rem">${data.id}</td></tr>
                    <tr><td>文档 ID</td><td>${documentId || '-'}</td></tr>
                    <tr><td>分片索引</td><td>${metadata.chunk_index ?? '-'}</td></tr>
                    <tr><td>标题</td><td>${metadata.title || '-'}</td></tr>
                    <tr><td>作者</td><td>${formatArray(metadata.authors)}</td></tr>
                    <tr><td>年份</td><td>${metadata.year || '-'}</td></tr>
                    <tr><td>类型</td><td>${metadata.doc_type || '-'}</td></tr>
                    <tr><td>关键词</td><td>${formatKeywords(metadata.keywords)}</td></tr>
                </table>
            `;
            document.getElementById('metadata-content').innerHTML = metadataHtml;

            // Set action buttons
            if (documentId) {
                const btnDoc = document.getElementById('btn-view-doc');
                const btnMd = document.getElementById('btn-view-md');
                const btnPdf = document.getElementById('btn-view-pdf');

                btnDoc.href = `/assist/detail/${documentId}`;
                btnDoc.style.display = 'inline-flex';

                btnMd.href = `/assist/markdown/${documentId}`;
                btnMd.style.display = 'inline-flex';

                api.get(`/assist/api/documents/${documentId}/file-alias`)
                    .then(data => { btnPdf.href = data.url; btnPdf.style.display = 'inline-flex'; })
                    .catch(() => { btnPdf.style.display = 'none'; });
            }

            // Render vector info
            const vector = data.payload?.vector || data.vector;
            let vectorHtml = '';

            if (vector && vector.vector) {
                const vec = vector.vector;
                vectorHtml = `
                    <p class="vector-info">维度: ${vec.length}</p>
                    <p class="vector-info">前 10 个值:</p>
                    <div class="vector-preview">${vec.slice(0, 10).map(v => v.toFixed(6)).join(', ')}...</div>
                `;
            } else if (Array.isArray(vector)) {
                vectorHtml = `
                    <p class="vector-info">维度: ${vector.length}</p>
                    <p class="vector-info">前 10 个值:</p>
                    <div class="vector-preview">${vector.slice(0, 10).map(v => v.toFixed(6)).join(', ')}...</div>
                `;
            } else {
                vectorHtml = '<p class="vector-info">无向量数据</p>';
            }
            document.getElementById('vector-content').innerHTML = vectorHtml;

            // Render text content
            const text = data.payload?.text || '无文本内容';
            document.getElementById('text-content').textContent = text;

            // Render raw JSON
            document.getElementById('json-content').textContent = JSON.stringify(data, null, 2);
        }

        function formatArray(arr) {
            if (!arr || !Array.isArray(arr)) return '-';
            return arr.join(', ');
        }

        function formatKeywords(keywords) {
            if (!keywords || !Array.isArray(keywords)) return '-';
            return keywords.map(k => `<span class="badge badge-uploaded">${k}</span>`).join(' ');
        }

        // Check URL params
        function checkUrlParams() {
            const params = new URLSearchParams(window.location.search);
            const pointId = params.get('id');
            const collection = params.get('collection');

            if (pointId) {
                document.getElementById('point-id').value = pointId;
            }
            if (collection) {
                document.getElementById('collection-select').value = collection;
            }
            if (pointId) {
                loadPoint();
            }
        }

        // Enter key to search
        document.getElementById('point-id').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') loadPoint();
        });

        // Init
        loadCollections().then(checkUrlParams);
    </script>
</body>
</html>
