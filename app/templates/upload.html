<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上传 PDF - OKB-Assist</title>
    <link rel="stylesheet" href="/assist/static/style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>📚 OKB-Assist</h1>
            <nav id="nav"></nav>
        </div>
    </header>

    <main class="container">
        <div class="card">
            <h2 style="margin-bottom:1rem">上传 PDF 文件</h2>

            <div class="upload-area" id="upload-area">
                <p style="font-size:3rem">📄</p>
                <p>拖拽 PDF 文件到此处，或点击选择文件</p>
                <p style="font-size:0.75rem">仅支持 .pdf 格式</p>
                <p style="font-size:0.8rem;color:#888">上传后将自动从 PDF 提取元数据（含 DOI）</p>
                <p style="font-size:0.8rem;color:#888">支持批量上传（多选 PDF）；上传后将自动从 Crossref 补全元数据</p>
                <input type="file" id="file-input" accept=".pdf" multiple style="display:none">
            </div>

            <div id="upload-progress" style="display:none;margin-top:1rem">
                <p id="upload-progress-text">上传中...</p>
                <progress value="0" max="100" style="width:100%"></progress>
            </div>
        </div>
    </main>

    <script src="/assist/static/app.js"></script>
    <script>
        const uploadArea = document.getElementById('upload-area');
        const fileInput = document.getElementById('file-input');
        const progressDiv = document.getElementById('upload-progress');
        const progressText = document.getElementById('upload-progress-text');

        // Click to select file
        uploadArea.addEventListener('click', () => fileInput.click());

        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        // 拖拽上传：支持一次拖入多个 PDF
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            if (e.dataTransfer.files && e.dataTransfer.files.length) {
                uploadFiles(e.dataTransfer.files);
            }
        });

        // 点击选择文件：支持多选
        fileInput.addEventListener('change', () => {
            if (fileInput.files && fileInput.files.length) {
                uploadFiles(fileInput.files);
            }
            // 重置，保证同一文件可再次选择
            fileInput.value = '';
        });

        // 批量上传多个 PDF，并在每个上传成功后自动触发 Crossref 元数据补全
        async function uploadFiles(fileList) {
            // 转为数组并仅保留 PDF 文件（扩展名大小写不敏感）
            const files = Array.from(fileList).filter(f =>
                f.name.toLowerCase().endsWith('.pdf'));
            if (files.length === 0) {
                showToast('只支持 PDF 文件', 'error');
                return;
            }

            // 显示上传进度区域，隐藏拖拽区
            progressDiv.style.display = 'block';
            uploadArea.style.display = 'none';

            const ids = [];
            let done = 0;

            for (const file of files) {
                try {
                    // 逐个上传文件
                    const result = await api.upload('/assist/api/documents/upload', file);
                    ids.push(result.id);

                    // 自动从 Crossref 补全元数据（后台任务，失败忽略）
                    api.post(`/assist/api/pipeline/${result.id}/crossref`).catch(() => {});

                    done++;
                    // 更新进度文案
                    progressText.textContent = `已上传 ${done}/${files.length}`;
                } catch (err) {
                    // 单个文件失败不阻断其余文件
                    showToast(`${file.name}: ${err.message}`, 'error');
                }
            }

            progressText.textContent = `上传完成：${ids.length}/${files.length}`;
            showToast(`上传完成：${ids.length}/${files.length}`, 'success');

            // 跳转：有多个则去最后一个详情页，否则回上传页
            setTimeout(() => {
                window.location.href = ids.length
                    ? `/assist/detail/${ids[ids.length - 1]}`
                    : '/assist/upload';
            }, 800);
        }
    </script>
</body>
</html>
