[package]
name = "okb-client"
version = "0.2.0"
edition = "2021"
description = "OKB-Assist 客户端工具：Zotero CSV 导入 / 目录 PDF 批量比对上传"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"
dirs = "5"
reqwest = { version = "0.12", features = ["multipart", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["full"] }
walkdir = "2"