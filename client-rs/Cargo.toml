[package]
name = "okb-client"
version = "0.2.0"
edition = "2021"
description = "OKB-Assist 客户端工具：Zotero CSV 导入 / 目录 PDF 批量比对上传"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"
dirs = "5"
# 用 rustls 而非 native-tls（openssl），静态 musl 构建（树莓派/ARM64）不依赖目标机 openssl
reqwest = { version = "0.12", default-features = false, features = ["multipart", "json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
walkdir = "2"