[package]
name = "import-zotero"
version = "0.1.0"
edition = "2021"
description = "读取 Zotero 导出的 CSV 文件，逐条上传到 OKB-Assist 服务"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"
dirs = "5"
reqwest = { version = "0.12", features = ["multipart", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
