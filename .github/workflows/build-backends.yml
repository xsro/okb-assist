name: Build Backend Binaries

on:
  push:
    # main 分支的每次推送都自动构建（只出 arm64 后端 artifact）
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# 同一分支/同一 tag 上连续推送时，取消尚未跑完的旧运行，避免排队刷屏
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 约定：
# - 平常（推送 main 分支 / workflow_dispatch 手动触发）只构建 ubuntu-22.04-arm 的后端（okb_assist，静态链接 musl）并上传 artifact；
# - 容器参考：https://github.com/actions/runner-images
# - 推送 v* tag 时才额外构建 macOS / Windows / Linux-x64 后端、前端 dist、以及客户端（okb-client）；
# - Release 只在推送 v* tag 时创建。

jobs:
  build-macos-arm64:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Install Rust (target: aarch64-apple-darwin)"
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Build backend
        run: cargo build --release --features mupdf --target aarch64-apple-darwin
        working-directory: backend-rs

      - name: Prepare backend artifact
        run: cp backend-rs/target/aarch64-apple-darwin/release/okb_assist okb-assist-macos-arm64

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: okb-assist-macos-arm64
          path: okb-assist-macos-arm64

      - name: Build client
        if: startsWith(github.ref, 'refs/tags/v')
        run: cargo build --release --target aarch64-apple-darwin
        working-directory: client-rs

      - name: Prepare client artifact
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp client-rs/target/aarch64-apple-darwin/release/okb-client okb-client-macos-arm64

      - name: Upload client artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: okb-client-macos-arm64
          path: okb-client-macos-arm64

  build-win-x64:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Install Rust (target: x86_64-pc-windows-msvc)"
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build backend
        run: cargo build --release --features mupdf --target x86_64-pc-windows-msvc
        working-directory: backend-rs

      - name: Prepare backend artifact
        shell: pwsh
        run: Copy-Item backend-rs\target\x86_64-pc-windows-msvc\release\okb_assist.exe okb-assist-win-x64.exe

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: okb-assist-win-x64
          path: okb-assist-win-x64.exe

      - name: Build client
        if: startsWith(github.ref, 'refs/tags/v')
        run: cargo build --release --target x86_64-pc-windows-msvc
        working-directory: client-rs

      - name: Prepare client artifact
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Copy-Item client-rs\target\x86_64-pc-windows-msvc\release\okb-client.exe okb-client-win-x64.exe

      - name: Upload client artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: okb-client-win-x64
          path: okb-client-win-x64.exe

  build-linux-x64:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsqlite3-dev \
            libfontconfig1-dev \
            pkg-config

      - name: "Install Rust (target: x86_64-unknown-linux-gnu)"
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build backend
        run: cargo build --release --features mupdf --target x86_64-unknown-linux-gnu
        working-directory: backend-rs

      - name: Prepare backend artifact
        run: cp backend-rs/target/x86_64-unknown-linux-gnu/release/okb_assist okb-assist-linux-x64

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: okb-assist-linux-x64
          path: okb-assist-linux-x64

      - name: Build client
        if: startsWith(github.ref, 'refs/tags/v')
        run: cargo build --release --target x86_64-unknown-linux-gnu
        working-directory: client-rs

      - name: Prepare client artifact
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp client-rs/target/x86_64-unknown-linux-gnu/release/okb-client okb-client-linux-x64

      - name: Upload client artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: okb-client-linux-x64
          path: okb-client-linux-x64

  # 前端 dist 只在发版（v* tag）时构建，平常不打包
  build-frontend:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install
        working-directory: frontend

      - name: Build frontend
        run: pnpm run build
        working-directory: frontend

      - name: Package frontend dist
        run: zip -r ../frontend-dist.zip dist
        working-directory: frontend

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist.zip

  # 树莓派 / ARM64 Linux：静态链接 musl，产物不依赖目标机 glibc/musl 版本
  #
  # 注意：musl 目标**不启用**内嵌 mupdf（`--features mupdf`）。mupdf-sys 在 Linux 上走
  #       font-kit → 系统 fontconfig/freetype，且 mupdf 本体含 C++ 源码（harfbuzz/zxing 等），
  #       需要 musl 版 C/C++ 交叉工具链才能静态链接，CI 上不可靠；
  #       因此这里用默认特性（PDF 引擎 = 外部 mutool，与 system.json 的 mutool_path 配合），
  #       这也正是 config.json 的 `pdf.engine` 默认值。
  build-raspberry-pi-arm64:
    runs-on: ubuntu-22.04-arm
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools pkg-config

      - name: "Install Rust (target: aarch64-unknown-linux-musl)"
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Build backend (static musl)
        run: cargo build --release --target aarch64-unknown-linux-musl
        working-directory: backend-rs

      - name: Verify static binary
        run: |
          BIN=backend-rs/target/aarch64-unknown-linux-musl/release/okb_assist
          file "$BIN"
          if file "$BIN" | grep -q "statically linked"; then
            echo "okb_assist 已静态链接 ✔"
          else
            echo "::error::okb_assist 不是静态链接"
            exit 1
          fi

      - name: Prepare backend artifact
        run: cp backend-rs/target/aarch64-unknown-linux-musl/release/okb_assist okb-assist-linux-arm64-musl

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: okb-assist-linux-arm64-musl
          path: okb-assist-linux-arm64-musl

      - name: Build client (static musl)
        if: startsWith(github.ref, 'refs/tags/v')
        run: cargo build --release --target aarch64-unknown-linux-musl
        working-directory: client-rs

      - name: Prepare client artifact
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp client-rs/target/aarch64-unknown-linux-musl/release/okb-client okb-client-linux-arm64-musl

      - name: Upload client artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: okb-client-linux-arm64-musl
          path: okb-client-linux-arm64-musl

  create-release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-frontend
      - build-macos-arm64
      - build-win-x64
      - build-linux-x64
      - build-raspberry-pi-arm64
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
