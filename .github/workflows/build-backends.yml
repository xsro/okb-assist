name: Build Backend Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos-arm64:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Install Rust (target: aarch64-apple-darwin)"
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Build
        run: cargo build --release --target aarch64-apple-darwin
        working-directory: backend-rs

      - name: Prepare artifact
        run: cp backend-rs/target/aarch64-apple-darwin/release/okb_assist okb-assist-macos-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: okb-assist-macos-arm64
          path: okb-assist-macos-arm64

  build-win-x64:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Install Rust (target: x86_64-pc-windows-msvc)"
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc
        working-directory: backend-rs

      - name: Prepare artifact
        shell: pwsh
        run: Copy-Item backend-rs\target\x86_64-pc-windows-msvc\release\okb_assist.exe okb-assist-win-x64.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: okb-assist-win-x64
          path: okb-assist-win-x64.exe

  build-linux-x64:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: "Install Rust (target: x86_64-unknown-linux-gnu)"
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build
        run: cargo build --release --target x86_64-unknown-linux-gnu
        working-directory: backend-rs

      - name: Prepare artifact
        run: cp backend-rs/target/x86_64-unknown-linux-gnu/release/okb_assist okb-assist-linux-x64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: okb-assist-linux-x64
          path: okb-assist-linux-x64

  build-raspberry-pi-arm64:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compilation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu pkg-config
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev:arm64

      - name: "Install Rust (target: aarch64-unknown-linux-gnu)"
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Build (cross-compile)
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target aarch64-unknown-linux-gnu
        working-directory: backend-rs

      - name: Prepare artifact
        run: cp backend-rs/target/aarch64-unknown-linux-gnu/release/okb_assist okb-assist-linux-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: okb-assist-linux-arm64
          path: okb-assist-linux-arm64
