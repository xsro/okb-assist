name: Build Backend Binaries

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Install Rust (target: aarch64-apple-darwin)"
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Build
        run: cargo build --release --features mupdf --target aarch64-apple-darwin
        working-directory: backend-rs

      - name: Prepare artifact
        run: cp backend-rs/target/aarch64-apple-darwin/release/okb_assist okb-assist-macos-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: okb-assist-macos-arm64
          path: okb-assist-macos-arm64

  build-win-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Install Rust (target: x86_64-pc-windows-msvc)"
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build
        run: cargo build --release --features mupdf --target x86_64-pc-windows-msvc
        working-directory: backend-rs

      - name: Prepare artifact
        shell: pwsh
        run: Copy-Item backend-rs\target\x86_64-pc-windows-msvc\release\okb_assist.exe okb-assist-win-x64.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: okb-assist-win-x64
          path: okb-assist-win-x64.exe

  build-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsqlite3-dev \
            libfontconfig1-dev \
            pkg-config

      - name: "Install Rust (target: x86_64-unknown-linux-gnu)"
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build
        run: cargo build --release --features mupdf --target x86_64-unknown-linux-gnu
        working-directory: backend-rs

      - name: Prepare artifact
        run: cp backend-rs/target/x86_64-unknown-linux-gnu/release/okb_assist okb-assist-linux-x64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: okb-assist-linux-x64
          path: okb-assist-linux-x64

  build-raspberry-pi-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsqlite3-dev \
            libfontconfig1-dev \
            pkg-config

      - name: "Install Rust (target: aarch64-unknown-linux-gnu)"
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Build
        run: cargo build --release --features mupdf --target aarch64-unknown-linux-gnu
        working-directory: backend-rs

      - name: Prepare artifact
        run: cp backend-rs/target/aarch64-unknown-linux-gnu/release/okb_assist okb-assist-linux-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: okb-assist-linux-arm64
          path: okb-assist-linux-arm64

  create-release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-macos-arm64
      - build-win-x64
      - build-linux-x64
      - build-raspberry-pi-arm64
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
